<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SecureShare - Mã Hóa & Chia Sẻ Tài Liệu</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.85);
            --border-color: #334155;
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .container { width: 100%; max-width: 580px; margin: 0 auto; }
        
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header p { color: var(--text-muted); font-size: 0.85rem; margin-top: 6px; }

        .tabs {
            display: flex;
            background: var(--card-bg);
            padding: 4px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 16px;
            gap: 4px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px 8px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .tab-btn.active {
            background: var(--primary-color);
            color: white;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            backdrop-filter: blur(10px);
            margin-bottom: 20px;
        }

        .drop-zone {
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            padding: 28px 16px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .drop-zone:hover { border-color: var(--primary-color); }

        .input-group { margin-bottom: 14px; }
        .input-group label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 6px; font-weight: 500; }
        .input-group input {
            width: 100%;
            padding: 12px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: white;
            font-size: 0.9rem;
            outline: none;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .btn:hover { background: var(--primary-hover); }

        .result-box {
            margin-top: 16px;
            padding: 14px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            word-break: break-all;
            font-size: 0.85rem;
        }

        .hidden { display: none !important; }

        @media (max-width: 480px) {
            body { padding: 12px; }
            .card { padding: 16px; }
            .header h1 { font-size: 1.5rem; }
            .drop-zone { padding: 20px 10px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>SecureShare</h1>
        <p>Chia sẻ tệp tin mã hóa bảo mật E2EE</p>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('upload')">
            <i data-lucide="upload"></i> Gửi Tệp
        </button>
        <button class="tab-btn" onclick="switchTab('download')">
            <i data-lucide="download"></i> Nhận Tệp
        </button>
    </div>

    <div id="uploadTab" class="card">
        <div class="drop-zone" onclick="document.getElementById('fileInput').click()">
            <i data-lucide="file-up" style="width:36px; height:36px; color:var(--primary-color); margin-bottom:8px;"></i>
            <p style="font-size: 0.9rem;">Nhấn để chọn tệp hoặc kéo thả vào đây</p>
            <input type="file" id="fileInput" style="display: none" onchange="handleFileSelect(this.files[0])">
            <div id="fileNameDisplay" style="margin-top: 10px; font-weight: 600; color: #818cf8; font-size: 0.85rem;"></div>
        </div>
        <button class="btn" style="margin-top: 16px;" onclick="encryptAndUpload()">
            <i data-lucide="lock"></i> Mã Hóa & Gửi Tệp
        </button>
        <div id="uploadResult" class="result-box hidden"></div>
    </div>

    <div id="downloadTab" class="card hidden">
        <div class="input-group">
            <label>Mã Tệp (File ID)</label>
            <input type="text" id="fileIdInput" placeholder="Nhập ID tệp cần tải">
        </div>
        <div class="input-group">
            <label>Khóa Giải Mã (Secret Key)</label>
            <input type="text" id="keyInput" placeholder="Nhập khóa giải mã">
        </div>
        <button class="btn" onclick="downloadAndDecrypt()">
            <i data-lucide="key"></i> Giải Mã & Tải Về
        </button>
        <div id="downloadResult" class="result-box hidden"></div>
    </div>

    <!-- Khung Lịch Sử Riêng Trên Máy Này -->
    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
            <h3 style="font-size: 0.95rem; color: #f8fafc; display: flex; align-items: center; gap: 6px;">
                <i data-lucide="history" style="width: 18px; color: var(--primary-color);"></i> Lịch Sử Đã Gửi (Trên Máy Này)
            </h3>
            <button onclick="loadLocalHistory()" style="background: #334155; border: none; color: #cbd5e1; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; display: flex; align-items: center; gap: 4px;">
                <i data-lucide="refresh-cw" style="width: 14px;"></i> Làm mới
            </button>
        </div>
        <div id="historyTableContainer" style="overflow-x: auto;">
            <p style="color: #94a3b8; font-size: 0.85rem;">Chưa có dữ liệu.</p>
        </div>
    </div>
</div>

<script src="app.js"></script>
<script>lucide.createIcons();</script>
</body>
</html>
