<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureShare - Mã Hóa & Chia Sẻ Tệp Báo Mật E2EE</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Container được mở rộng lên 720px để cột thời gian không bị che khuất */
        .main-container {
            width: 100%;
            max-width: 720px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.2rem;
            color: #818cf8;
            margin-bottom: 6px;
        }

        .header p {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 24px;
        }

        /* Khung Tab Chuyển Đổi */
        .tab-container {
            display: flex;
            background-color: #151c2c;
            border-radius: 12px;
            padding: 5px;
            margin-bottom: 20px;
            border: 1px solid #2a364f;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            color: #94a3b8;
            font-weight: 600;
            font-size: 0.95rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .tab-btn.active {
            background-color: #6366f1;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        /* Card Nội Dung Main */
        .card {
            background-color: #151c2c;
            border-radius: 16px;
            padding: 24px;
            border: 1px solid #2a364f;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
        }

        /* Area Kéo Thả File */
        .drop-zone {
            border: 2px dashed #3b82f6;
            border-radius: 12px;
            padding: 30px 20px;
            background-color: rgba(59, 130, 246, 0.03);
            cursor: pointer;
            transition: background 0.3s ease;
            margin-bottom: 20px;
        }

        .drop-zone:hover {
            background-color: rgba(59, 130, 246, 0.08);
        }

        .drop-zone-icon {
            font-size: 2.2rem;
            color: #818cf8;
            margin-bottom: 10px;
        }

        .drop-zone-text {
            color: #cbd5e1;
            font-size: 0.9rem;
        }

        /* Nhập Liệu Trong Tab Nhận */
        .input-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .input-group label {
            display: block;
            color: #94a3b8;
            font-size: 0.85rem;
            margin-bottom: 6px;
        }

        .input-field {
            width: 100%;
            padding: 12px 14px;
            background-color: #0b0f19;
            border: 1px solid #2a364f;
            border-radius: 8px;
            color: #f1f5f9;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-field:focus {
            border-color: #6366f1;
        }

        /* Nút Thực Thi Chính */
        .btn-primary {
            width: 100%;
            padding: 14px;
            background-color: #6366f1;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary:hover {
            background-color: #4f46e5;
        }

        /* Khung Kết Quả Thông Báo */
        .result-box {
            margin-top: 16px;
            padding: 14px;
            background-color: #0b0f19;
            border-radius: 8px;
            border: 1px solid #2a364f;
            text-align: left;
            font-size: 0.85rem;
            word-break: break-all;
        }

        /* Khung Lịch Sử */
        .history-card {
            background-color: #151c2c;
            border-radius: 16px;
            padding: 20px;
            border: 1px solid #2a364f;
            text-align: left;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .history-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: #f1f5f9;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-refresh {
            background-color: #1e293b;
            color: #cbd5e1;
            border: 1px solid #334155;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-refresh:hover {
            background-color: #334155;
            color: #fff;
        }

        /* Utilities */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- Header -->
        <div class="header">
            <h1>SecureShare</h1>
            <p>Chia sẻ tệp tin mã hóa bảo mật E2EE</p>
        </div>

        <!-- Thanh Chuyển Tab -->
        <div class="tab-container">
            <button class="tab-btn active" onclick="switchTab('upload')">
                <span>📤 Gửi Tệp</span>
            </button>
            <button class="tab-btn" onclick="switchTab('download')">
                <span>📥 Nhận Tệp</span>
            </button>
        </div>

        <!-- ================= TAB GỬI TỆP ================= -->
        <div id="uploadSection">
            <div class="card">
                <div class="drop-zone" onclick="document.getElementById('fileInput').click()">
                    <input type="file" id="fileInput" style="display: none;" onchange="handleFileSelect(this.files[0])">
                    <div class="drop-zone-icon">📁</div>
                    <div class="drop-zone-text">Nhấn để chọn tệp hoặc kéo thả vào đây</div>
                    <div id="fileNameDisplay" style="margin-top: 10px; color: #818cf8; font-weight: 600; font-size: 0.88rem;"></div>
                </div>

                <button class="btn-primary" onclick="encryptAndUpload()">
                    🔒 Mã Hóa & Gửi Tệp
                </button>

                <div id="uploadResult" class="result-box hidden"></div>
            </div>

            <!-- Lịch Sử Gửi -->
            <div class="history-card">
                <div class="history-header">
                    <div class="history-title">
                        <span>🔄</span> Lịch Sử Đã Gửi (Trên Máy Này)
                    </div>
                    <button class="btn-refresh" onclick="loadLocalHistory(true)">🔄 Làm mới</button>
                </div>
                <div id="historyTableContainer"></div>
            </div>
        </div>

        <!-- ================= TAB NHẬN TỆP ================= -->
        <div id="downloadSection" class="hidden">
            <div class="card">
                <div class="input-group">
                    <label for="fileIdInput">Mã Tệp (File ID)</label>
                    <input type="text" id="fileIdInput" class="input-field" placeholder="Nhập Mã Tệp...">
                </div>

                <div class="input-group">
                    <label for="keyInput">Khóa Giải Mã (Secret Key)</label>
                    <input type="text" id="keyInput" class="input-field" placeholder="Nhập Khóa Giải Mã...">
                </div>

                <button class="btn-primary" onclick="downloadAndDecrypt()">
                    🔓 Tải Về & Giải Mã
                </button>

                <div id="downloadResult" class="result-box hidden"></div>
            </div>

            <!-- Lịch Sử Nhận -->
            <div class="history-card">
                <div class="history-header">
                    <div class="history-title">
                        <span>🔄</span> Lịch Sử Đã Nhận (Trên Máy Này)
                    </div>
                    <button class="btn-refresh" onclick="loadReceiveHistory(true)">🔄 Làm mới</button>
                </div>
                <div id="receiveHistoryTableContainer"></div>
            </div>
        </div>
    </div>

    <!-- Tải File Logic JavaScript -->
    <script src="app.js"></script>
</body>
</html>
