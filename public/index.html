<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureShare - Mã Hóa & Chia Sẻ Tệp Bảo Mật E2EE</title>
    <!-- Thư viện nén ZIP hỗ trợ gửi nhiều tệp cùng lúc -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b1120;
            color: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .main-container {
            width: 100%;
            max-width: 720px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.2rem;
            color: #818cf8;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .header p {
            color: #94a3b8;
            font-size: 0.92rem;
            margin-bottom: 24px;
        }

        /* Khung Tab Chuyển Đổi */
        .tab-container {
            display: flex;
            background-color: #131b2e;
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 20px;
            border: 1px solid #1e293b;
        }

        .tab-btn {
            flex: 1;
            padding: 11px 16px;
            border: none;
            background: transparent;
            color: #94a3b8;
            font-weight: 600;
            font-size: 0.92rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .tab-btn.active {
            background-color: #6366f1;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.25);
        }

        /* Card Main */
        .card {
            background-color: #131b2e;
            border-radius: 16px;
            padding: 24px;
            border: 1px solid #1e293b;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
        }

        /* Dropzone */
        .drop-zone {
            border: 2px dashed #313d52;
            border-radius: 12px;
            padding: 36px 20px;
            background-color: rgba(255, 255, 255, 0.01);
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .drop-zone:hover {
            border-color: #6366f1;
            background-color: rgba(99, 102, 241, 0.03);
        }

        .drop-zone-icon {
            margin-bottom: 12px;
            color: #818cf8;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .drop-zone-text {
            color: #cbd5e1;
            font-size: 0.9rem;
        }

        /* Input */
        .input-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .input-group label {
            display: block;
            color: #94a3b8;
            font-size: 0.85rem;
            margin-bottom: 6px;
        }

        .input-field {
            width: 100%;
            padding: 12px 14px;
            background-color: #0b1120;
            border: 1px solid #1e293b;
            border-radius: 8px;
            color: #f1f5f9;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-field:focus {
            border-color: #6366f1;
        }

        /* Nút chính */
        .btn-primary {
            width: 100%;
            padding: 13px;
            background-color: #6366f1;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.98rem;
            cursor: pointer;
            transition: background 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary:hover {
            background-color: #4f46e5;
        }

        /* Kết quả */
        .result-box {
            margin-top: 16px;
            padding: 14px;
            background-color: #0b1120;
            border-radius: 8px;
            border: 1px solid #1e293b;
            text-align: left;
            font-size: 0.85rem;
            word-break: break-all;
        }

        /* Lịch sử */
        .history-card {
            background-color: #131b2e;
            border-radius: 16px;
            padding: 20px;
            border: 1px solid #1e293b;
            text-align: left;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .history-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: #f1f5f9;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-refresh {
            background-color: rgba(255, 255, 255, 0.05);
            color: #cbd5e1;
            border: 1px solid #2a364f;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .btn-refresh:hover {
            background-color: #1e293b;
            color: #fff;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- Header -->
        <div class="header">
            <h1>SecureShare</h1>
            <p>Chia sẻ tệp tin mã hóa bảo mật E2EE</p>
        </div>

        <!-- Tabs -->
        <div class="tab-container">
            <button class="tab-btn active" onclick="switchTab('upload')">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                <span>Gửi Tệp</span>
            </button>
            <button class="tab-btn" onclick="switchTab('download')">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                <span>Nhận Tệp</span>
            </button>
        </div>

        <!-- TAB GỬI TỆP -->
        <div id="uploadSection">
            <div class="card">
                <div class="drop-zone" onclick="document.getElementById('fileInput').click()">
                    <!-- Đã thêm 'multiple' và truyền 'this.files' vào hàm handleFileSelect -->
                    <input type="file" id="fileInput" style="display: none;" multiple onchange="handleFileSelect(this.files)">
                    <div class="drop-zone-icon">
                        <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#818cf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><polyline points="9 15 12 12 15 15"/></svg>
                    </div>
                    <div class="drop-zone-text">Nhấn để chọn tệp (có thể chọn nhiều) hoặc kéo thả vào đây</div>
                    <div id="fileNameDisplay" style="margin-top: 10px; color: #818cf8; font-weight: 600; font-size: 0.88rem;"></div>
                </div>

                <button id="btnEncrypt" class="btn-primary" onclick="encryptAndUpload()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    <span>Mã Hóa & Gửi Tệp</span>
                </button>

                <div id="uploadResult" class="result-box hidden"></div>
            </div>

            <!-- Lịch Sử Gửi -->
            <div class="history-card">
                <div class="history-header">
                    <div class="history-title">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#818cf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
                        <span>Lịch Sử Đã Gửi (Trên Máy Này)</span>
                    </div>
                    <button class="btn-refresh" onclick="loadLocalHistory(true)">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6"/><path d="M21.34 15.57a10 10 0 1 1-.57-8.38l2.37-2.37"/></svg>
                        <span>Làm mới</span>
                    </button>
                </div>
                <div id="historyTableContainer"></div>
            </div>
        </div>

        <!-- TAB NHẬN TỆP -->
        <div id="downloadSection" class="hidden">
            <div class="card">
                <div class="input-group">
                    <label for="fileIdInput">Mã Tệp (File ID)</label>
                    <input type="text" id="fileIdInput" class="input-field" placeholder="Nhập Mã Tệp...">
                </div>

                <div class="input-group">
                    <label for="keyInput">Khóa Giải Mã (Secret Key)</label>
                    <input type="text" id="keyInput" class="input-field" placeholder="Nhập Khóa Giải Mã...">
                </div>

                <button id="btnDecrypt" class="btn-primary" onclick="downloadAndDecrypt()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg>
                    <span>Tải Về & Giải Mã</span>
                </button>

                <div id="downloadResult" class="result-box hidden"></div>
            </div>

            <!-- Lịch Sử Nhận -->
            <div class="history-card">
                <div class="history-header">
                    <div class="history-title">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#818cf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
                        <span>Lịch Sử Đã Nhận (Trên Máy Này)</span>
                    </div>
                    <button class="btn-refresh" onclick="loadReceiveHistory(true)">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6"/><path d="M21.34 15.57a10 10 0 1 1-.57-8.38l2.37-2.37"/></svg>
                        <span>Làm mới</span>
                    </button>
                </div>
                <div id="receiveHistoryTableContainer"></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
